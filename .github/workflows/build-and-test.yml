name: Build and Test

permissions:
  contents: read
  packages: write

on:
  push:
  pull_request:
  workflow_dispatch: 

env:
  USERNAME: joelborner
  FEED_URL: https://nuget.pkg.github.com/joelborner/index.json
  VCPKG_BINARY_SOURCES: clear;nuget,https://nuget.pkg.github.com/joelborner/index.json,readwrite
  VCPKG_TARGET_TRIPLET: x64-windows-release


jobs:
  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $ciVcpkgRoot = "$env:RUNNER_TEMP\vcpkg"

          if (Test-Path $ciVcpkgRoot) {
            Remove-Item $ciVcpkgRoot -Recurse -Force
          }

          git clone https://github.com/microsoft/vcpkg.git $ciVcpkgRoot
          git -C $ciVcpkgRoot checkout 6df3270abdba60f18ec48308dbd72ece94729e1e
          & "$ciVcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics

          "VCPKG_ROOT=$ciVcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_EXE=$ciVcpkgRoot\vcpkg.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add GitHub Packages NuGet source
        shell: pwsh
        run: |
          $nugetExe = & "$env:VCPKG_EXE" fetch nuget
          & $nugetExe sources add `
            -Source "$env:FEED_URL" `
            -StorePasswordInClearText `
            -Name GitHubPackages `
            -UserName "$env:USERNAME" `
            -Password "${{ secrets.GITHUB_TOKEN }}"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/windows-release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}\vcpkg-triplets"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build/windows-release --config Release --parallel

      - name: Run unit tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows-release -C Release --output-on-failure

      - name: Clean old test output
        shell: pwsh
        run: |
          if (Test-Path .\sample_data\test_sim\output) {
            Remove-Item .\sample_data\test_sim\output -Recurse -Force
          }

      - name: Run test
        shell: pwsh
        run: |
          .\build\windows-release\Release\rockfall3d.exe .\sample_data\test_sim\test_sim.xml
      - name: Check outputs
        shell: pwsh
        run: |
          if (-not (Test-Path .\sample_data\test_sim\output\manifest.csv)) { throw "manifest missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\deposition_points.shp)) { throw "shapefile missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\trajectories_001.rfbin)) { throw "trajectories missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\count_rocks.tif)) { throw "raster missing" }
