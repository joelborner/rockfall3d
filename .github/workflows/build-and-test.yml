name: Build and Test

on:
  push:
  pull_request:

jobs:
  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:RUNNER_TEMP\vcpkg
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat"
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install eigen3:x64-windows
          & "$env:VCPKG_ROOT\vcpkg.exe" install gdal:x64-windows


      - name: Configure
        run: |
          cmake -S . -B build/windows-release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: |
          cmake --build build/windows-release --config Release

      - name: Clean old test output
        run: |
          if (Test-Path .\sample_data\test_sim\output) {
            Remove-Item .\sample_data\test_sim\output -Recurse -Force
          }

      - name: Run test
        run: |
          .\build\windows-release\Release\rockfall3d.exe .\sample_data\test_sim\test_sim.xml

      - name: Check outputs
        run: |
          if (-not (Test-Path .\sample_data\test_sim\output\manifest.csv)) { throw "manifest missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\deposition_points.shp)) { throw "shapefile missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\trajectories_001.rfbin)) { throw "trajectories missing" }
          if (-not (Test-Path .\sample_data\test_sim\output\count_rocks.tif)) { throw "raster missing" }

